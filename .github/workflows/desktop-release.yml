name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Harness
        shell: pwsh
        run: |
          pnpm exec tsc -b tsconfig.host.json
          pnpm exec tsdown --env.DSH_BUILD_FACE host
          pnpm exec tsc -b tsconfig.client.json
          pnpm exec tsdown --env.DSH_BUILD_FACE client
          pnpm --filter @deepseek-ai/dsh-web-frontend run build

      - name: Build desktop app
        run: pnpm --dir apps/desktop run pack

      - name: Package desktop app
        shell: pwsh
        run: |
          Compress-Archive `
            -Path apps/desktop/dist-desktop/win-unpacked/* `
            -DestinationPath apps/desktop/dist-desktop/DeepSeek-Harness-Desktop-win-x64.zip `
            -Force

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/dist-desktop/DeepSeek-Harness-Desktop-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
